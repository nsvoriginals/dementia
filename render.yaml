# Dementia on Render: Blueprint deploy
# Dashboard → New → Blueprint → connect repo → set sync:false secrets in Render UI.
# After first deploy: add custom domains `dementia.fun` and `api.dementia.fun`, then
# update Google OAuth redirect URLs to use `https://dementia.fun/api/auth/callback/google`.

databases:
  - name: dementia-db
    plan: free
    databaseName: dementia
    user: dementia

services:
  - type: web
    name: dementia-api
    runtime: node
    plan: free
    healthCheckPath: /health
    buildCommand: npm ci
    preDeployCommand: npm run db:deploy --workspace=@repo/db
    startCommand: npx tsx apps/api/src/index.ts
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: dementia-db
          property: connectionString
      - key: BETTER_AUTH_SECRET
        generateValue: true
      - key: FRONTEND_ORIGIN
        fromService:
          type: web
          name: dementia-web
          envVarKey: RENDER_EXTERNAL_URL
      - key: BETTER_AUTH_URL
        fromService:
          type: web
          name: dementia-web
          envVarKey: RENDER_EXTERNAL_URL
      - key: HYDRA_DB_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: MODEL_PROVIDER
        value: openai

  - type: web
    name: dementia-web
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build --workspace=frontend
    startCommand: npm run start --workspace=frontend
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: dementia-db
          property: connectionString
      - key: BETTER_AUTH_SECRET
        fromService:
          type: web
          name: dementia-api
          envVarKey: BETTER_AUTH_SECRET
      - key: BETTER_AUTH_URL
        fromService:
          type: web
          name: dementia-web
          envVarKey: RENDER_EXTERNAL_URL
      - key: NEXT_PUBLIC_BETTER_AUTH_URL
        fromService:
          type: web
          name: dementia-web
          envVarKey: RENDER_EXTERNAL_URL
      - key: FRONTEND_ORIGIN
        fromService:
          type: web
          name: dementia-web
          envVarKey: RENDER_EXTERNAL_URL
      - key: NEXT_PUBLIC_API_URL
        fromService:
          type: web
          name: dementia-api
          envVarKey: RENDER_EXTERNAL_URL
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
